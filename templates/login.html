<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Login — Ah Liki IMS</title>
{% load static %}<link rel="stylesheet" href="{% static 'css/main.css' %}">
</head>
<body>
<div class="login-wrap">
  <div class="login-card">
    <div class="login-logo">
      <div class="mark">AL</div>
      <h1>Ah Liki Wholesale</h1>
      <p>Inventory Management System</p>
    </div>
    {% if form.errors %}
    <div class="alert alert-error">Invalid username or password.</div>
    {% endif %}
    <form method="post">
      {% csrf_token %}
      <div class="form-group">
        <label>Username</label>
        <input type="text" name="username" autofocus placeholder="Enter username">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" name="password" placeholder="Enter password">
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;margin-top:8px">Sign in</button>
    </form>
    <p style="text-align:center;margin-top:20px;font-size:12px;color:var(--gray-500)">Ah Liki Samoa &mdash; Apia, Samoa</p>
  </div>
</div>
</body>
</html>

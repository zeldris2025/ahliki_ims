{% extends 'base.html' %}
{% block title %}Add Category — Ah Liki IMS{% endblock %}
{% block topbar_title %}Add Category{% endblock %}
{% block content %}
<div class="page-header"><div><h1>Add Category</h1></div><a href="{% url 'category_list' %}" class="btn btn-secondary">← Back</a></div>
<div class="card" style="max-width:500px">
  <div class="card-body">
    <form method="post">{% csrf_token %}
      {% for field in form %}<div class="form-group"><label>{{ field.label }}</label>{{ field }}</div>{% endfor %}
      <button type="submit" class="btn btn-primary">Save category</button>
    </form>
  </div>
</div>
{% endblock %}

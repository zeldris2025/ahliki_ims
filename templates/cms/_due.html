{% if c.returned %}<span class="cms-due none">Returned</span>{% else %}{% with d=c.days_left %}{% if d is None %}<span class="cms-due none" title="{% if not c.arrival_date %}No arrival date{% else %}{{ c.owner }} has no return days set{% endif %}">— No deadline</span>{% elif d < 0 %}<span class="cms-due critical" title="Due {{ c.return_due|date:'d M Y' }}">⚠ Overdue {{ c.days_overdue }}d</span>{% elif d == 0 %}<span class="cms-due serious" title="Due {{ c.return_due|date:'d M Y' }}">⏰ Due today</span>{% elif d <= 3 %}<span class="cms-due serious" title="Due {{ c.return_due|date:'d M Y' }}">⏰ {{ d }}d left</span>{% elif d <= 7 %}<span class="cms-due warning" title="Due {{ c.return_due|date:'d M Y' }}">◷ {{ d }}d left</span>{% else %}<span class="cms-due ok" title="Due {{ c.return_due|date:'d M Y' }}">✓ {{ d }}d left</span>{% endif %}{% endwith %}{% endif %}
